# Compila la app de Android en cada commit y deja el APK como artefacto descargable.
# URL del API dentro del APK: variable del repositorio VITE_API_URL
# (Settings → Secrets and variables → Actions → Variables). Sin ella usa la del emulador.
name: App Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web y copiarla al proyecto Android
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://10.0.2.2:4000' }}
        run: |
          npx vite build --mode movil
          npx cap sync android

      - name: Compilar APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Nombre del APK
        id: nombre
        run: echo "nombre=TilcaGo-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nombre.outputs.nombre }}
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
