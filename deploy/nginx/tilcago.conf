# Bloque para el Nginx del servidor. Copiar a /etc/nginx/sites-available/tilcago,
# reemplazar el dominio, enlazar en sites-enabled y luego:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tilcago.tudominio.com
# Certbot agrega el bloque de HTTPS y la redirección desde HTTP.
server {
    listen 80;
    server_name tilcago.tudominio.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;   # WEB_PORT de deploy/.env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Al enviar una transacción el API espera la confirmación de Stellar
        proxy_read_timeout 120s;
    }
}
